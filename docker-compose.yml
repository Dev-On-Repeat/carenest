version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carenest_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./carenest.db
      - SECRET_KEY=carenest-production-jwt-secret-key-2026-high-security
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/carenest.db:/app/carenest.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carenest_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

